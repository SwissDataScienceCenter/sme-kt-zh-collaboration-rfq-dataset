- file: request/2026-05-20_Mail_Reding_Plan.eml
  id: m3
  from: reding
  to: RBe
  date: '2026-05-20T21:05:00'
  subject: 'AW: Plan Attika'
  attach_plan: true
  body: 'Guten Abend Herr Betschart


    Wie besprochen der Plan vom Attikageschoss (von 1993, leider nur als Scan). Die Terrasse geht ja noch um die Ecke beim Sitzplatz, deshalb ist sie glaub eher grösser als die 70 m2.


    Fotos schicke ich Ihnen noch, ich bin gerade nicht zuhause. Ab dem 25. Mai bin ich dann bis am 20. Juli geschäftlich in Asien, per Mail bin ich aber erreichbar.


    Freundliche Grüsse

    Thomas Reding

    '
  quote_inline:
  - from: RBe
    to: reding
    date: '2026-05-15T11:02:00'
    subject: Plan Attika
    body: 'Grüezi Hr. Reding

      wie besprochen bitte Plan Attika per Mail.

      Gruss R. Betschart


      Gesendet von meinem iPhone'
- file: request/2026-06-02_Mail_Talkessel_STWEG.eml
  id: m4
  from: kaelin
  to: offerten@fronalp-mgh.ch
  cc: reding
  date: '2026-06-02T14:26:00'
  subject: STWEG Seestrasse 18 Brunnen, Sanierung Terrasse Attika
  mailer: Microsoft Outlook 16.0
  body: 'Sehr geehrte Damen und Herren


    Wir verwalten die Stockwerkeigentümergemeinschaft Seestrasse 18 in Brunnen. Herr Reding hat uns informiert, dass er Sie wegen der undichten Terrasse kontaktiert hat. Unser Hauswart hat die Fuge beim
    Ablauf provisorisch abgedichtet; die Flecken in der Wohnung 3. OG sind seither nicht grösser geworden.


    Wir weisen darauf hin, dass die Abdichtung der Terrasse zu den gemeinschaftlichen Teilen gehört. Auftraggeberin ist deshalb die STWEG, vertreten durch uns. Bitte adressieren Sie die Offerte an:

    STWEG Seestrasse 18, c/o Talkessel Immobilien-Treuhand AG, Rebbergstrasse 25, 6430 Schwyz.


    Der Plattenbelag gehört zum Sondernutzungsrecht der Attikawohnung. Bitte offerieren Sie deshalb die Wiederverwendung der bestehenden Steinplatten. Die Mehrkosten für einen neuen Belag würde Herr Reding
    allenfalls selber tragen.


    Gemäss unseren Unterlagen (Verkaufsdokumentation 1994) misst die Terrasse ca. 70 m2. Der Ausschuss rechnet mit einem Budget von rund CHF 70''000. Bitte berücksichtigen Sie auch Notüberläufe nach heutiger
    Norm (SIA 271). Wir holen zwei weitere Offerten ein.


    Damit wir die Unterlagen vor den Sommerferien vorbereiten können, benötigen wir Ihre Offerte bis spätestens 8. Juli 2026. Die Eigentümerversammlung findet am 27. August 2026 statt.


    Freundliche Grüsse

    Claudia Kälin

    Bewirtschafterin STWEG

    Talkessel Immobilien-Treuhand AG

    Rebbergstrasse 25, 6430 Schwyz

    Tel. +41 41 000 30 89

    '
