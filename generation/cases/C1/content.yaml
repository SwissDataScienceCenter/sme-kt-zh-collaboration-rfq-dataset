meeting_notes:
  mail_id: m_notes
  file_name: Besprechungsnotiz_2026-06-18_STWEG_Seestrasse18.docx
  title: Besprechungsnotiz
  meta:
  - - Objekt
    - STWEG Seestrasse 18, 6440 Brunnen, Sanierung Terrasse Attika
  - - Datum / Ort
    - 18.06.2026, 14:00 bis 15:05 Uhr, Microsoft Teams
  - - Teilnehmende
    - Herr R. Betschart (Fronalp Metall & Gebäudehülle AG), Herr Th. Reding (Eigentümer Attika, zugeschaltet aus dem Ausland), Frau C. Kälin (Talkessel Immobilien-Treuhand AG, Notiz)
  - - Verteiler
    - Teilnehmende, Ausschuss STWEG
  sections:
  - - 1. Ausgangslage
    - - Seit Winter 2025/26 Wasserflecken an der Decke der Wohnung 3. OG unter der Attikaterrasse. Abdichtung von 1994, Steinplatten in Splitt, Dachrand Kupfer, Stahlgeländer.
      - Provisorische Abdichtung beim Ablauf durch den Hauswart (Mai 2026).
      - Die Abdichtung ist gemeinschaftliches Eigentum der STWEG, der Plattenbelag Sondernutzungsrecht Attika.
  - - 2. Fläche
    - - Gemäss Fronalp nach Plan ca. 93 m2 inkl. Sitzplatz Ost. Gemäss Verkaufsdokumentation 1994 ca. 70 m2. Differenz wird in der Offerte ausgewiesen.
  - - 3. Vorgehen
    - - Herr Reding ist bis 20.07. im Ausland. Die Terrasse ist nur über die Attikawohnung zugänglich, eine Besichtigung vor der Offerte ist deshalb nicht möglich.
      - Fronalp offeriert auf Basis Plan und Annahmen. Die Annahmen werden in der Offerte klar deklariert. Eine Besichtigung erfolgt vor der Ausführung.
  - - 4. Technisches
    - - '2 bestehende Dachabläufe, keine Notüberläufe vorhanden. Neu: 1 Notüberlauf.'
      - 5 Fenstertüren (3 Wohnen, 2 Zimmer) sind anzuschliessen. Der neue Aufbau wird rund 12 cm höher; die Schwellen sind vor Ort zu prüfen.
      - Dachrand wieder in Kupfer, passend zur Fassade.
      - Das Stahlgeländer muss für die Arbeiten demontiert und danach wieder montiert werden. Die Geländerhöhe nach der Sanierung ist zu prüfen.
      - Materialtransport nur per Kran (4. OG). Fronalp rechnet mit ca. 16 Stunden in 3 Einsätzen. Die Bewilligung für den öffentlichen Grund (Gemeinde Ingenbohl) organisiert Fronalp über das Kranunternehmen.
      - Die Wohnung 3. OG ist bewohnt. Fenster und Fassade sind während der Arbeiten zu schützen.
      - Die Verwaltung wünscht nach Abschluss einen Nachweis der Dichtheit.
  - - 5. Kosten
    - - 'Budget gemäss Vorgabe Ausschuss STWEG: rund CHF 70''000.'
      - Fronalp schätzt bei vollständigem Neuaufbau mit Dämmung nach heutigem Stand CHF 70'000 bis 85'000.
      - Grundofferte mit Wiederverwendung der bestehenden Platten (gemeinschaftliche Kosten). Ein neuer Belag wird als Eventualposition offeriert; die Mehrkosten trägt der Eigentümer Attika.
      - Herr Reding bevorzugt neue Platten und entscheidet bis zur Versammlung.
  - - 6. Termine
    - - Offerte bis 08.07.2026 an die Verwaltung, Kopie an Herrn Reding.
      - Eigentümerversammlung 27.08.2026.
      - Ausführung frühestens ab September 2026.
  todos:
  - - Offerte an STWEG c/o Verwaltung
    - Fronalp
    - 08.07.2026
  - - Entscheid Belag (neu oder wiederverwenden)
    - Herr Reding
    - 27.08.2026
  - - Fotos Terrasse an Fronalp
    - Herr Reding
    - offen
  footer: Ohne Gegenbericht innert 5 Tagen gilt diese Notiz als genehmigt. Schwyz, 19.06.2026, C. Kälin
