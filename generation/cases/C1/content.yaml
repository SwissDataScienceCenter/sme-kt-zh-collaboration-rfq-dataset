mails:
- file: request/2026-05-12_Mail_Reding_Anfrage.eml
  id: m1
  from: reding
  to: offerten@fronalp-mgh.ch
  date: '2026-05-12T19:42:00'
  subject: Terrasse undicht, Bitte um Offerte
  mailer: iPhone Mail (21F90)
  body: 'Grüezi


    Ich bin Eigentümer der Attikawohnung an der Seestrasse 18 in Brunnen. Seit dem Winter haben wir ein Problem mit unserer Terrasse: In der Wohnung unter uns (3. OG) sind an der Decke Wasserflecken aufgetaucht,
    vor allem nach starkem Regen. Ein Bekannter meinte, die Abdichtung sei nach über 30 Jahren wohl am Ende.


    Die Terrasse hat ca. 70 m2 (so steht es in der Verkaufsdokumentation), Steinplatten in Splitt verlegt, das Haus ist Baujahr 1994. Am Rand hat es ein Kupferblech.


    Könnten Sie uns eine Offerte für die Sanierung machen? Im August haben wir die Eigentümerversammlung und möchten das dort traktandieren.


    Fotos anbei.


    Freundliche Grüsse

    Thomas Reding

    Seestrasse 18

    6440 Brunnen

    079 000 41 27

    '
