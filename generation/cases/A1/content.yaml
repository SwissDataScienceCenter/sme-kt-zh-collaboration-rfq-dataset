  - file: request/2026-06-01_Mail_Gisler_Stiftungsrat.eml
    id: m4
    from: gisler
    to: CSc
    date: "2026-06-01T07:55:00"
    subject: "AW: Pläne Hofmattweg 2/4"
    mailer: "Microsoft Outlook 16.0"
    body: |
      Grüezi Frau Schuler

      Der Stiftungsrat hat am Freitag über die Dächer gesprochen. Er möchte nicht nur wissen, ob repariert werden kann, sondern für das Budget 2027 drei Varianten mit Kosten sehen:

      1. Reparatur der schadhaften Stellen
      2. Gesamtsanierung mit Wärmedämmung nach heutigem Standard
      3. wie 2, aber vorbereitet für eine Photovoltaikanlage

      Ausserdem wäre es gut, wenn Sie uns nachher bei der Ausschreibung der Bauarbeiten begleiten könnten. Bitte berücksichtigen Sie das in Ihrer Offerte.

      Freundliche Grüsse
      Andreas Gisler
    quote: [m3]
  - file: request/2026-06-03_Mail_CSc_Rueckfragen.eml
    id: m5
    from: CSc
    to: gisler
    date: "2026-06-03T11:30:00"
    subject: "AW: AW: Pläne Hofmattweg 2/4"
    mailer: "Microsoft Outlook 16.0"
    body: |
      Grüezi Herr Gisler

      Danke für die Pläne und die Rückmeldung des Stiftungsrats. Bevor ich die Offerte fertigstelle, vier Punkte:

      Thermografie: Sie liefert nur bei einem grossen Temperaturunterschied zwischen innen und aussen verwertbare Bilder, also in der Heizperiode von Oktober bis März. Im Juni würden wir darauf verzichten. Die Feuchte im Dachaufbau stellen wir mit Sondierungen und einer Feuchtemessung fest.

      Sondierungen: Bei einem Dach von 1974 müssen wir vor dem Öffnen Proben der Dachpappe und der Kittfugen auf Asbest, PCB und PAK (Teer) untersuchen lassen. Das Labor braucht rund 5 Arbeitstage.

      Variante 3 mit Photovoltaik: Soll sie fest in die Offerte oder als Option? Für die Statik einer PV-Anlage braucht es zudem einen Ingenieur.

      Ausschreibung: Möchten Sie die Begleitung gleich mit offeriert haben oder zuerst nur Zustand und Varianten?

      Freundliche Grüsse
      Claudia Schuler
      Geschäftsführerin
      Fronalp Metall & Gebäudehülle AG
    quote: [m4, m3]
  - file: request/2026-06-05_Mail_Gisler_Antwort.eml
    id: m6
    from: gisler
    to: CSc
    date: "2026-06-05T14:10:00"
    subject: "AW: AW: AW: Pläne Hofmattweg 2/4"
    mailer: "Microsoft Outlook 16.0"
    body: |
      Grüezi Frau Schuler

      Danke für die Erklärungen. Ohne Thermografie ist in Ordnung. Die Ausschreibung machen wir selber, das ist bei uns in der Verwaltung so üblich, bitte nicht offerieren. Die PV-Vorbereitung bitte nur als Option, der Stiftungsrat ist sich da noch nicht einig. Mit der Schadstoffanalyse sind wir einverstanden, bitte beauftragen Sie das Labor direkt.

      Wann könnten Sie mit der Aufnahme beginnen? Der Bericht sollte vor der nächsten Sitzung des Stiftungsrats am 4. September vorliegen.

      Freundliche Grüsse
      Andreas Gisler
    quote: [m5, m4]
  - file: operations/2026-06-08_Mail_RBe_Kostenschaetzung.eml
    id: m7
    from: RBe
    to: CSc
    date: "2026-06-08T17:05:00"
    subject: "Hofmatt Steinen Kostenschätzung"
    body: |
      Hallo Claudia

      Für die Kostenschätzung rechne ich wie in Brunnen pro Variante etwa 3 Std, für die PV-Variante auch. Die Statik für PV müsste die Statik Talkessel machen, sie hätte im August Zeit.

      Gruss Reto
  - file: offer/2026-06-09_Mail_CSc_Offerte.eml
    id: m8
    from: CSc
    to: gisler
    date: "2026-06-09T16:40:00"
    subject: "Honorarofferte OF-26-0147 Flachdächer Hofmattweg 2 und 4"
    mailer: "Microsoft Outlook 16.0"
    attach_offer: true
    body: |
      Grüezi Herr Gisler

      Gerne senden wir Ihnen im Anhang unsere Honorarofferte für die Zustandsaufnahme und die Sanierungsvarianten der Flachdächer am Hofmattweg 2 und 4.

      Die Offerte umfasst die Aufnahme beider Dächer mit Sondierungen, den Zustandsbericht und zwei Varianten mit Kostenschätzung. Die PV-Vorbereitung und eine Präsentation an der Sitzung des Stiftungsrats sind als Optionen aufgeführt, die Begleitung der Ausschreibung ist wie gewünscht nicht enthalten. Das Labor für die Schadstoffproben beauftragen wir nach Ihrer Auftragserteilung.

      Damit der Stiftungsrat die Unterlagen zwei Wochen vor der Sitzung vom 4. September erhält, bräuchten wir den Auftrag bis 12. Juni. Dann können wir die Aufnahme am 16. Juni machen. Bitte beachten Sie unsere Betriebsferien vom 13. bis 31. Juli.

      Die Plane auf Haus 4 sollte der Hauswart nach jedem Gewitter kontrollieren. Eine Sofortreparatur der Rissstelle können wir Ihnen jederzeit separat nach Regie ausführen.

      Freundliche Grüsse
      Claudia Schuler
      Geschäftsführerin, Bauingenieurin FH
      Fronalp Metall & Gebäudehülle AG
      Werkhofstrasse 12, 6438 Ibach
      +41 41 000 12 00
    quote: [m6]

