fee_offer:
  salutation: "Sehr geehrter Herr Gisler"
  intro: ["Besten Dank für Ihre Anfrage vom 18. Mai 2026, die Begehung vom 27. Mai und Ihre Rückmeldungen nach der Sitzung des Stiftungsrats. Gerne offerieren wir der Stiftung Wohnen Hofmatt die Zustandsaufnahme der beiden Flachdächer und zwei Sanierungsvarianten."]
  situation:
    - "Nach dem Gewitter vom 14. Mai 2026 ist in zwei Wohnungen im 3. OG von Haus 4 Wasser eingetreten. Die Flachdächer beider Häuser haben vermutlich noch den Aufbau von 1974, auf Haus 2 mit Flickstellen von 1998."
    - "Der Stiftungsrat möchte für das Budget 2027 wissen, ob eine Reparatur genügt oder eine Gesamtsanierung nötig ist, und die Kosten beider Wege kennen. Eine Vorbereitung für Photovoltaik wird als Option geprüft."
  documents: ["Pläne 1974, Dachaufsicht 1:200 (Scan der Verwaltung vom 28.05.2026)", "Befund unserer Begehung vom 27.05.2026"]
  phase_scope:
    "1 Grundlagen und Bestandesaufnahme": ["Aufnahmetag 1: beide Dächer mit Fotodokumentation, Dachrand, Einläufe und Anschlüsse; Probenahme für die Schadstoffanalyse mit Schutzmassnahmen (eine kleine Kernprobe je Dach durch den ganzen Aufbau, Kittfugen, Lüftungsrohr, Kaminabdeckung); Wasserschäden in den Wohnungen 3. OG Haus 4", "Aufnahmetag 2 nach dem Laborresultat: 5 Sondierungen mit Probeöffnung und Verschluss (Haus 4 beim Einlauf Nordost, Feld und Lüftungsrohr; Haus 2 Feld und Flickstellen 1998), Feuchtemessung je Dach"]
    "2 Analyse und Zustandsbericht": ["Zustandsbericht beider Dächer: Aufbau, Feuchte, Gefälle, Entwässerung und fehlende Notüberläufe, Höhe der Aufbordungen, Dachrand und Durchdringungen, Ursache des Wassereintritts, Restlebensdauer, Sofortmassnahmen und Empfehlung"]
    "3 Varianten und Kostenschätzung": ["Variante A Reparatur der schadhaften Bereiche, Variante B Gesamtsanierung mit Wärmedämmung nach heutigem Standard (mit Erhöhung von Dachrand und Aufbordungen, Notüberläufen und Absturzsicherung für den Unterhalt), je für beide Dächer", "Kostenschätzung je Variante (Genauigkeit ±25 %) durch unseren Projektleiter Dach, Reto Betschart", "Besprechung der Ergebnisse mit der Verwaltung"]
    "Option: Variante C PV-Vorbereitung": ["Variante C wie B, zusätzlich vorbereitet für eine Photovoltaikanlage (Befestigungspunkte, Leitungsführung), mit Kostenschätzung", "Die statische Prüfung der Decke für eine PV-Anlage ist nicht enthalten"]
    "Option: Präsentation an der Sitzung des Stiftungsrats": ["Vorstellung von Bericht und Varianten an der Sitzung vom 4. September 2026 in Steinen"]
  schedule:
    - "Aufnahmetag 1 mit Probenahme am Dienstag, 16. Juni 2026. Laborresultat nach rund 5 Arbeitstagen, Aufnahmetag 2 mit den Sondierungen Ende Juni oder Anfang Juli, bei trockenem Wetter."
    - "Zustandsbericht bis 10. Juli 2026, vor unseren Betriebsferien vom 13. bis 31. Juli. Varianten und Kostenschätzung bis 14. August, Besprechung mit der Verwaltung in der Woche vom 17. August, Unterlagen für den Stiftungsrat bis 21. August 2026."
    - "Verschieben sich die Sondierungen wegen Wetter oder Schadstoffbefund, liefern wir den Zustandsbericht bis 7. August; der Termin vom 21. August bleibt."
    - "Voraussetzung ist die Auftragserteilung bis 12. Juni 2026."
  options_note: "Die Optionen können mit dem Auftrag oder bis spätestens 30. Juni 2026 bestellt werden, damit sie bis zur Sitzung vom 4. September vorliegen."
  closing: ["Fronalp möchte sich an der späteren Ausschreibung der Bauarbeiten beteiligen. Bericht und Kostenschätzungen dürfen für die Ausschreibung verwendet werden.", "Wir danken Ihnen für Ihr Vertrauen und stehen für Fragen gerne zur Verfügung."]
  order_by: "für die Stiftung Wohnen Hofmatt"
  signature_role: "Geschäftsführerin, Bauingenieurin FH"
