    subject: "Wassereintritt Flachdach Hofmattweg 2/4 Steinen"
    mailer: "Microsoft Outlook 16.0"
    body: |
      Guten Tag

      Wir verwalten im Auftrag der Stiftung Wohnen Hofmatt die beiden Mehrfamilienhäuser am Hofmattweg 2 und 4 in Steinen (Baujahr 1974). Nach dem Gewitter vom letzten Donnerstag ist in zwei Wohnungen im 3. OG von Haus 4 Wasser durch die Decke gekommen. Der Hauswart hat Kübel aufgestellt, der Dachdecker, der früher für die Stiftung gearbeitet hat, ist pensioniert.

      Wir möchten das Dach nun grundsätzlich anschauen lassen: eine Zustandsaufnahme mit Thermografie und einen Kurzbericht, ob eine Reparatur reicht oder ob saniert werden muss. Die Dachfläche beträgt total ca. 500 m2, Kies, soweit ich weiss noch der ursprüngliche Aufbau.

      Können Sie uns dafür eine Offerte machen? Der Stiftungsrat tagt Ende Mai.

      Freundliche Grüsse
      Andreas Gisler
      Bewirtschafter
      Rigi Verwaltungen AG
      Dorfstrasse 8, 6410 Goldau
      Tel. +41 76 000 62 64
