    subject: "Anfrage Aussentreppe zum Balkon"
    mailer: "Mail für iPhone"
    attach_sketch: true
    body: |
      Guten Abend

      Wir bauen das Obergeschoss unseres Hauses zu einer kleinen Wohnung für meine Schwiegermutter um und möchten vom Gartensitzplatz eine Treppe direkt auf den Balkon. Die Höhe ist laut den alten Plänen ca. 2.60 m, Platz an der Hauswand haben wir ca. 4.50 m bis zum Gartenweg. Die Skizze habe ich schnell von Hand gemacht.

      Die Treppe sollte anthrazit sein wie unsere Fenster. Ehrlich gesagt haben wir keine Ahnung, was es dafür alles braucht (Bewilligung, Fundament?). Können Sie uns ein Angebot machen?

      Freundliche Grüsse
      Marco Rickenbacher
      Gibelweg 7, 6443 Morschach
      079 000 58 14
