    body: |
      Grüezi Herr Lüönd

      Für eine Aussentreppe am Gibelweg 7 in Morschach brauchen wir zwei Einzelfundamente unter dem Gartensitzplatz (Betonplatten auf Kies). Grösse gemäss Statik, voraussichtlich 60 x 60 x 80 cm, Ankerplatten liefern wir. Die Platten müssten aufgenommen und wieder verlegt werden. Können Sie uns einen Pauschalpreis machen?

      Freundliche Grüsse
      Sandra Kälin
