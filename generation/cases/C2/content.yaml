      Guten Tag Frau Kälin

      Für die zwei Einzelfundamente 60 x 60 x 80 cm inkl. Plattenbelag aufnehmen und wieder verlegen, Aushub von Hand, Entsorgung, Beton C25/30 und Versetzen Ihrer Ankerplatten offerieren wir pauschal CHF 2'830.00 exkl. MWST. Stossen wir auf Fels, verrechnen wir den Mehraufwand mit CHF 380.00 pro m3. Vorlauf eine Woche, Preise gültig für eine Ausführung bis Ende März 2027.

