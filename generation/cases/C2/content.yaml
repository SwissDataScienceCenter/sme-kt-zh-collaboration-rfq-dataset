      Hallo Andrea

      Kannst du uns die Statik für eine gerade Aussentreppe offerieren? Höhe ca. 2.80 m (Balkonbelag noch offen), Lauflänge ca. 4.10 m, Breite 1.00 m, Wangen Flachstahl 200 x 12, Gitterroststufen. Unten auf zwei Fundamente, oben Anschluss an die Balkonplatte (Beton, Dicke laut Kunde ca. 18 cm, Haus von 1975). Wir brauchen den Nachweis auch für das Baugesuch.

      Danke und Gruss
      Sandra Kälin
      Projektleiterin Metallbau
