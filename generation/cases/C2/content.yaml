    from: rick
    to: SKae
    date: "2026-08-24T19:30:00"
    subject: "Treppe Gibelweg 7"
    mailer: "Mail für iPhone"
    body: |
      Guten Abend Frau Kälin

      Kurze Info: Wir haben inzwischen den Plattenleger bestellt. Auf dem Balkon kommen neue Platten in Mörtel, das gibt laut ihm total 4 cm mehr Höhe.

      Und noch eine Frage: Könnte man im Balkongeländer oben ein Türchen machen, damit unsere Enkel nicht die Treppe hinunterfallen?

      Gruss Marco Rickenbacher
  - file: operations/2026-08-25_Mail_TRe_Pruefung.eml
    id: m8
    from: TRe
    to: SKae
    date: "2026-08-25T07:15:00"
    subject: "Treppe Morschach"
    body: |
      Sandra

      16 Steigungen à 17.6. Nimm 27 cm Auftritt, sonst steht die Treppe unten direkt am Weg. Wegen der Enkel brauchen die offenen Stufen Zwischenstäbe. Fürs Lochblechgeländer rechne mit 4 Std pro m wegen der Rahmen, Lochblech erst nach dem Verzinken einklemmen. Wenn es günstiger sein muss: Stufen mit Seitenblechen verschraubt, das spart viel Werkstatt. Die Wangen sind unter 100 kg, das macht Werner mit dem Ladekran. Falls die Balkonplatte nicht reicht: zwei Stützen oben mit Fundamenten kosten etwa 2'500 bis 3'500.

      Toni
  - file: offer/2026-08-27_Mail_SKae_Offerte.eml
    id: m9
    from: SKae
    to: rick
    date: "2026-08-27T16:10:00"
    subject: "Offerte OF-26-0209 Aussentreppe Gibelweg 7"
    mailer: "Microsoft Outlook 16.0"
    attach_offer: true
    body: |
      Grüezi Herr Rickenbacher

      Vielen Dank für den Termin vor Ort und Ihre Mitteilung zum neuen Balkonbelag. Im Anhang finden Sie unsere Offerte für die Aussentreppe als Gesamtpaket mit Statik, Fundamenten, Plänen für das Baugesuch, Kran und Montage.

      Variante A entspricht Ihren Wünschen: geschweisste Stufen, Treppe und Lochblechgeländer anthrazit (die Gitterroststufen bleiben verzinkt) und ein Handlauf aus Chromstahl an der Wand. Variante B ist die günstigere Bauweise mit verschraubten Stufen. Die Treppe ist dort nur feuerverzinkt, Geländer und Wandhandlauf aus Stahl sind aber anthrazit, damit es zu Ihren Fenstern passt und Ihre Schwiegermutter auf beiden Seiten einen Handlauf hat. Wegen der Enkel haben wir in beiden Varianten Zwischenstäbe in den offenen Stufen vorgesehen. Das Türchen im Balkongeländer haben wir als Option aufgeführt.

      Ihr Budget von rund 24'000 Franken inklusive MWST erreichen wir leider auch mit Variante B nicht. Den grössten Teil der Kosten macht die Werkstattarbeit aus. Dazu kommen rund 8'000 Franken für das Gesamtpaket mit Fundamenten, Statik, Plänen, Baugesuch, Transport mit Ladekran und Projektleitung, die in beiden Varianten gleich sind. Gerne zeigen wir Ihnen bei einem Termin, wo noch Spielraum besteht.

      Zum Termin: Das Baugesuch reichen wir nach Ihrer Bestellung mit Ihrer Vollmacht ein. Mit Publikation und Einsprachefrist rechnen wir mit 8 bis 10 Wochen bis zur Bewilligung. Werkstatt und Verzinkerei sind über die Feiertage geschlossen. Bei einer Bestellung bis Mitte September rechnen wir deshalb mit der Montage Mitte bis Ende Januar 2027. Für den Einzug Ihrer Schwiegermutter im Dezember reicht es leider nicht; bis dahin bleibt der Zugang über den Hauseingang. Falls für den Umbau des Obergeschosses ein Baugesuch nötig ist, sollte die Treppe ins gleiche Gesuch.

      Freundliche Grüsse
      Sandra Kälin
      Projektleiterin Metallbau
      Fronalp Metall & Gebäudehülle AG
      Werkhofstrasse 12, 6438 Ibach
      +41 41 000 12 00
    quote: [m7]

