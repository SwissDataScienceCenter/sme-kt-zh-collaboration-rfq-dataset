      Grüezi Herr Inderbitzin

      Vielen Dank für das Telefon heute Morgen. Wie besprochen hier unsere Angaben für den Doppelcarport:

      - Breite 6.50 m, Tiefe 5.00 m
      - Farbe DB 703, gleich wie unser Garagentor
      - Seitenwand mit Lärchenlatten auf der Westseite, von dort kommt das Wetter
      - Dachrinne mit Fallrohr
      - Wir haben einen VW-Bus mit Dachbox, zusammen 2.25 m hoch. Passt das unter den Standard?

      Wir sind hier auf ca. 800 m, das sollte für Ihre Standardausführung ja reichen. Schnee hat es aber im Winter schon einiges, sagen die Nachbarn (wir wohnen erst seit letztem Jahr hier).

      Im Anhang der Situationsplan aus dem Geoportal, den Carport habe ich eingezeichnet. Er soll auf den Kiesplatz vor dem Haus. Schön wäre, wenn er vor dem Winter steht.

      Freundliche Grüsse
      Lukas Schnüriger
      Sonnenhaldenweg 6, 8843 Oberiberg
      079 000 64 21
  - file: request/2026-09-16_Mail_Schnueriger_Aenderungen.eml
    id: m2
    from: schn
    to: DIn
    date: "2026-09-16T18:30:00"
    subject: "AW: Carport Sonnenhaldenweg 6, Angaben und Situationsplan"
    mailer: "Mail für iPhone"
    quote: [m1]
    body: |
      Grüezi Herr Inderbitzin

      Leider noch zwei Änderungen. Wir haben mit dem Nachbarn auf der Westseite über das Baugesuch gesprochen und er besteht auf dem Grenzabstand. Uns bleiben deshalb nur noch 6.30 m Breite. Die Tiefe bleibt bei 5.00 m.

      Mein Schwager ist Bauingenieur. Er meint, bei uns oben müsse man die Schneelast nach SIA 261 rechnen lassen. Können Sie das machen und was kostet das zusätzlich?

      Die Fundamente sollen bitte auch von Ihnen gemacht werden, wir möchten nicht noch einen Baumeister suchen. Wie viele Fundamente braucht es und muss dafür der ganze Kies weg?

      Das Baugesuch möchten wir einreichen, sobald wir Ihre Unterlagen haben.

      Freundliche Grüsse
      Lukas und Sarah Schnüriger
  - file: operations/2026-09-17_Mail_DIn_Pruefung_TRe.eml
    id: m3
    from: DIn
    to: TRe
    date: "2026-09-17T08:05:00"
    subject: "Carport Doppel Oberiberg, Anpassungen prüfen"
    attach_siteplan: true
    quote: [m2]
    body: |
      Hallo Toni

      Doppelcarport CP-D für Neukunden in Oberiberg, Sonnenhaldenweg 6, Parzelle 1187, Situationsplan im Anhang. Der Kunde schreibt, sie seien auf ca. 800 m. Gewünscht sind 6.30 m Breite statt 6.00 m, Durchfahrtshöhe 2.40 m für einen VW-Bus mit Dachbox (2.25 m), DB 703, Seitenwand Lärche West, Rinne, Fundamente durch uns.

      Kannst du bitte kurz bestätigen, dass das alles mit dem Katalog geht? Der Schwager des Kunden will eine Schneelastberechnung nach SIA 261, siehe unten. Reicht unsere Typenstatik fürs Baugesuch?

      Gruss Daniel
  - file: operations/2026-09-17_Mail_TRe_Antwort.eml
    id: m4
    from: TRe
    to: DIn
    date: "2026-09-17T13:10:00"
    subject: "AW: Carport Doppel Oberiberg, Anpassungen prüfen"
    quote: [m3]
    body: |
      Hallo Daniel

      Geht alles mit dem Katalog. Die Typenstatik deckt in beiden Ausführungen, Standard und Verstärkt, Überbreite bis 60 cm und die Durchfahrtshöhe 2.40 m ab.

      Ob Standard oder Verstärkt, hängt vom Standort ab. Die Höhe bitte vom Situationsplan nehmen und nicht aus dem Mail.

      Fundamente: Doppel gemäss Typenstatik, 6 Punktfundamente, frostsicher. Der Kies muss nur bei den Fundamenten weg, der Rest bleibt. Die Fundamente machen wir etwa zwei Wochen vor der Montage.

      Eine eigene Schneelastberechnung machen wir nicht. Die Typenstatik ist nach SIA 261 gerechnet, Verstärkt auf 1200 m Bezugshöhe, und hat für Oberiberg bisher immer gereicht. Der Schwager kann sie gerne anschauen, Typenplan und Statik CP-D Verstärkt liegen im Ordner Systemprodukte, du kannst sie dem Kunden fürs Baugesuch schicken. Will er eine eigene Berechnung, muss der Kunde selber einen Ingenieur beauftragen.

      Sag dem Kunden noch: Bauprofile braucht es fürs Gesuch, das Fallrohr schliesst er selber an die Sickerleitung oder Kanalisation an, und aufs Dach darf kein Schnee vom Hausdach oder vom Schneeräumen, begehbar ist es auch nicht.

      Termin: Produktion erst, wenn die Bewilligung rechtskräftig ist. Mit Publikation und Einsprachefrist reicht das vor dem Schnee kaum, rechne mit Montage im Frühjahr, sobald der Platz schneefrei ist.

      Gruss Toni
  - file: offer/2026-09-18_Mail_DIn_Offerte.eml
    id: m5
    from: DIn
    to: schn
    date: "2026-09-18T15:30:00"
    subject: "Offerte OF-26-0228 Doppelcarport Sonnenhaldenweg 6"
    mailer: "Microsoft Outlook 16.0"
    attach_offer: true
    quote: [m2]
    body: |
      Grüezi Herr und Frau Schnüriger

      Vielen Dank für Ihre Angaben. Im Anhang erhalten Sie unsere Offerte für den Doppelcarport mit 6.30 m Breite.

      Ihr Vorplatz liegt gemäss Situationsplan auf 1'043 m ü. M. Für Standorte zwischen 801 und 1200 m bauen wir den Carport in der Ausführung Verstärkt, die für die höhere Schneelast ausgelegt ist. Die Zuschläge für Überbreite, Ausführung Verstärkt, Durchfahrtshöhe 2.40 m und die Farbe DB 703 sind in der Offerte einzeln aufgeführt.

      Zur Schneelast: Für die Ausführungen Standard und Verstärkt liegt eine Typenstatik inkl. Fundamente nach SIA 261 vor, die Ausführung Verstärkt ist auf 1200 m Bezugshöhe bemessen. Typenplan und Typenstatik senden wir Ihnen mit separatem Mail; Sie legen sie dem Baugesuch bei, und Ihr Schwager kann die Statik gerne prüfen. Eine eigene Schneelastberechnung bieten wir nicht an. Wünschen Sie eine weitergehende Berechnung, müssten Sie selber einen Ingenieur beauftragen.

      Die Fundamente erstellen wir: 6 frostsichere Punktfundamente gemäss Typenstatik, etwa zwei Wochen vor der Montage. Der Kies wird nur an diesen Stellen entfernt. Für das Baugesuch braucht es Bauprofile; das Fallrohr schliessen Sie bitte an eine Sickerleitung oder die Kanalisation an.

      Zum Termin: Die Lieferfrist beträgt 6 bis 8 Wochen ab Auftragsbestätigung und rechtskräftiger Baubewilligung. Mit Publikation und Einsprachefrist wird es vor dem Winter leider kaum reichen. Realistisch ist die Montage im Frühjahr 2027, sobald der Platz schneefrei ist. Bei einer Bestellung bis 18. Dezember 2026 halten wir die Preise für eine Montage bis Ende Juni 2027. Die Anzahlung von 30 % stellen wir erst mit der Produktionsfreigabe nach der rechtskräftigen Bewilligung in Rechnung.

      Für Fragen stehe ich Ihnen gerne zur Verfügung.

      Freundliche Grüsse
      Daniel Inderbitzin
      Projektleiter Systemprodukte und Fassaden
      Fronalp Metall & Gebäudehülle AG
      Werkhofstrasse 12, 6438 Ibach
      +41 41 000 12 00

