    to: schmidig
    date: "2026-10-01T16:20:00"
    subject: "Richtofferte OF-26-0236 Geländerprüfung Siedlung Rütimatt"
    mailer: "Microsoft Outlook 16.0"
    attach_files: [operations/OF-26-0236_Richtofferte_Gelaenderpruefung_Ruetimatt.pdf]
    body: |
      Grüezi Frau Schmidig

      Wie am Montag besprochen erhalten Sie im Anhang unsere Richtofferte für die Prüfung der Balkongeländer in der Siedlung Rütimatt, als Grundlage für Ihre Vorstandssitzung vom 20. Oktober. Die Treppenhäuser sind wie vereinbart nicht enthalten, da sie 2015 erneuert wurden.

      Die Richtofferte ist unverbindlich und hat eine Genauigkeit von ±25 %, da wir die Siedlung noch nicht gesehen haben. Nach dem Entscheid des Vorstands senden wir Ihnen gerne eine verbindliche Honorarofferte.

      Bitte lassen Sie den Balkon an der Rütimattstrasse 13 bis zur Reparatur gesperrt.

      Freundliche Grüsse
      Claudia Schuler
      Geschäftsführerin
      Fronalp Metall & Gebäudehülle AG
      Werkhofstrasse 12, 6438 Ibach
      +41 41 000 12 00
  - file: request/2026-10-21_Mail_Gwerder_Vorstand.eml
    id: m4
    from: gwerder
    to: CSc
    cc: schmidig
    date: "2026-10-21T19:45:00"
    subject: "AW: Richtofferte OF-26-0236 Geländerprüfung Siedlung Rütimatt"
    mailer: "Mail für iPhone"
    quote: [m3]
    body: |
      Sehr geehrte Frau Schuler

      Der Vorstand hat an der Sitzung vom 20. Oktober der Geländerprüfung zugestimmt. Nach dem Vorfall an der Rütimattstrasse 13 verlangt unsere Haftpflichtversicherung aber, dass alle Geländer der Siedlung geprüft werden, also alle 40 Balkone und auch die Treppenhäuser.

      Bitte senden Sie uns eine verbindliche Offerte. Den Bericht möchten wir an der Vorstandssitzung vom 19. Januar 2027 von Ihnen vorgestellt haben. Den Auftrag unterschreibe ich als Präsident, Frau Schmidig bleibt Ihre Ansprechperson.

      Freundliche Grüsse
      Bruno Gwerder
      Präsident Wohnbaugenossenschaft Talkessel
  - file: request/2026-10-22_Mail_CSc_Rueckfrage_Treppenhaeuser.eml
    id: m5
    from: CSc
    to: schmidig
    date: "2026-10-22T08:10:00"
    subject: "Geländerprüfung Rütimatt, Treppenhäuser und Termine"
    mailer: "Microsoft Outlook 16.0"
    body: |
      Grüezi Frau Schmidig

      Herr Gwerder hat uns geschrieben, dass nun auch die Treppenhäuser geprüft werden sollen. Wissen Sie oder der Hauswart, wie die Treppenhausgeländer von 2015 befestigt sind und wie viele Befestigungen es etwa pro Haus hat? Und ab wann könnten die Mieter für die Aufnahme informiert werden?

      Freundliche Grüsse
      Claudia Schuler
  - file: request/2026-10-23_Mail_Schmidig_Treppenhaeuser.eml
    id: m6
    from: schmidig
    to: CSc
    date: "2026-10-23T11:30:00"
    subject: "AW: Geländerprüfung Rütimatt, Treppenhäuser und Termine"
    mailer: "Microsoft Outlook 16.0"
    quote: [m5]
    body: |
      Grüezi Frau Schuler

      Herr Marty, unser Hauswart, sagt, die Geländer und Handläufe in den Treppenhäusern sind seitlich an der Treppe angeschraubt. Er hat im Haus 11 nachgezählt und kommt auf 16 Befestigungen, in den anderen Häusern ist es gleich.

      Die Mieter informieren wir mit einem Aushang eine Woche vorher. Termine sind ab dem 9. November möglich, Herr Marty begleitet Sie.

      Das Geländer an der Rütimattstrasse 13 hat Ihr Monteur am 6. Oktober repariert, der Anker war im Beton ausgebrochen. Herr Marty hat danach an allen Balkongeländern von Hand gerüttelt und nichts Auffälliges gefunden.

      Freundliche Grüsse
      Franziska Schmidig
  - file: operations/2026-10-26_Mail_SKae_Stunden.eml
    id: m7
    from: SKae
    to: CSc
    date: "2026-10-26T09:20:00"
    subject: "Rütimatt Geländer, meine Stunden"
    body: |
      Hallo Claudia

      Für die Rütimatt mit den Treppenhäusern rechne ich 4 Std vor Ort für die Befestigungen und die Korrosion, 3 Std für die Auszugsversuche und Massnahmen im Bericht und 4 Std Kostenschätzung. David macht die Auszugsversuche, er hat in der Woche vom 16. November Zeit.

      Gruss Sandra
  - file: offer/2026-10-27_Mail_CSc_Honorarofferte.eml
    id: m8
    from: CSc
    to: gwerder
    cc: schmidig
    date: "2026-10-27T15:50:00"
    subject: "Honorarofferte OF-26-0254 Geländerprüfung Siedlung Rütimatt"
    mailer: "Microsoft Outlook 16.0"
    attach_offer: true
    quote: [m4]
    body: |
      Sehr geehrter Herr Gwerder

      Besten Dank für den Entscheid des Vorstands. Im Anhang erhalten Sie unsere verbindliche Honorarofferte für die Prüfung aller Geländer der Siedlung Rütimatt.

      Gegenüber der Richtofferte vom 1. Oktober sind auf Wunsch Ihrer Versicherung die drei Treppenhäuser dazugekommen, dazu die Präsentation an der Vorstandssitzung vom 19. Januar 2027, ein Nachtermin für Mieter, die wir nicht antreffen, und eine Startbesprechung mit Frau Schmidig. Vor Rabatt ergibt das:

      - Treppenhäuser mit 6 zusätzlichen Auszugsversuchen: CHF 1'527.50
      - Präsentation im Vorstand: CHF 495.00
      - Nachtermin: CHF 250.00
      - Startbesprechung: CHF 185.00
      - Koordination drittes Haus, zweiter Prüftag und Fahrten: CHF 226.20

      Zusammen sind das CHF 2'683.70 vor Rabatt; der Umfang bei den Balkonen ist gleich geblieben. Deshalb liegt das Honorar über der Bandbreite von ±25 % der Richtofferte.

      Zu den Balkonen: Die Siedlung hat 40 Wohnungen, aber nur 36 Balkone. Die vier Wohnungen im Erdgeschoss haben Sitzplätze ohne Geländer, diese sind nicht Teil der Prüfung.

      Die Auszugsversuche machen wir als Stichprobe an rund 10 % der Anker, ausgewählt nach der Sichtprüfung. Bitte klären Sie mit Ihrer Versicherung, ob ihr dieses Vorgehen genügt.

      Die Aufnahme planen wir ab Mittwoch, 11. November, die Auszugsversuche in der Woche vom 16. November. Bitte nennen Sie im Aushang auch diese Woche, weil wir für die Versuche rund 15 Wohnungen ein zweites Mal betreten. Rote Befunde melden wir Frau Schmidig und Herrn Marty am gleichen Tag. Den Bericht erhalten Sie bis am 18. Dezember 2026.

      Freundliche Grüsse
      Claudia Schuler
      Geschäftsführerin
      Fronalp Metall & Gebäudehülle AG
      Werkhofstrasse 12, 6438 Ibach
      +41 41 000 12 00

