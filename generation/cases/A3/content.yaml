    subject: "Lockeres Balkongeländer Rütimattstrasse 13, Prüfung Geländer"
    mailer: "Microsoft Outlook 16.0"
    body: |
      Guten Morgen

      Am Wochenende hat uns eine Mieterin an der Rütimattstrasse 13 gemeldet, dass ihr Balkongeländer wackelt. Der Hauswart hat es provisorisch mit einem Spannset gesichert.

      Der Vorstand möchte jetzt die Geländer der ganzen Siedlung Rütimatt prüfen lassen, wie Sie das letztes Jahr in der Bachmatt gemacht haben. Können Sie mich bitte heute zurückrufen?

      Freundliche Grüsse
      Franziska Schmidig
      Vorstand, Ressort Bau
      Wohnbaugenossenschaft Talkessel
      Gartenweg 4, 6430 Schwyz
      078 000 18 59
