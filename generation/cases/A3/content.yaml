fee_offer:
  salutation: "Sehr geehrter Herr Gwerder"
  intro:
    - "Besten Dank für Ihr Mail vom 21. Oktober 2026 und die Auskünfte von Frau Schmidig. Gerne offerieren wir der Wohnbaugenossenschaft Talkessel die Prüfung aller Geländer der Siedlung Rütimatt."
    - "Gegenüber unserer Richtofferte OF-26-0236 vom 1. Oktober 2026, die nur die Balkongeländer umfasste, sind auf Wunsch Ihrer Haftpflichtversicherung die drei Treppenhausgeländer mit ihren Auszugsversuchen dazugekommen, ebenso die Präsentation im Vorstand, ein Nachtermin für nicht angetroffene Mieter und eine Startbesprechung."
  situation:
    - "An der Rütimattstrasse 13 hat sich im September 2026 ein Balkongeländer gelockert, der Anker war im Beton ausgebrochen; es wurde am 6. Oktober 2026 repariert. Der Hauswart hat danach alle Balkongeländer von Hand geprüft; das ersetzt die Auszugsversuche nicht, weil ein ausgebrochener Anker von aussen oft nicht sichtbar ist. Die Balkongeländer der drei Häuser von 1968 sind original, die Treppenhausgeländer wurden 2015 erneuert."
    - "Die Siedlung hat 40 Wohnungen und 36 Balkone; die vier Wohnungen im Erdgeschoss haben Sitzplätze ohne Geländer."
    - "Der Vorstand und die Versicherung möchten wissen, welche Geländer sicher sind, wo sofort gehandelt werden muss und welche Massnahmen in den nächsten Jahren zu budgetieren sind."
  documents: ["Angaben von Frau Schmidig (Telefon 28.09.2026, Mail 23.10.2026) und des Hauswarts", "Mail des Präsidenten vom 21.10.2026", "Unser Bericht Siedlung Bachmatt 2025 als Vorlage"]
  phase_scope:
    "1 Grundlagen und Vorbereitung": ["Terminplan für 36 Wohnungen und 3 Treppenhäuser mit dem Hauswart, Aushang für die Mieter", "Startbesprechung mit dem Ressort Bau"]
    "2 Aufnahme vor Ort und Auszugsversuche": ["Sichtprüfung und Messung jedes Geländers: Höhe, Öffnungen, Bekletterbarkeit, Korrosion, Befestigung und Spiel von Pfosten und Handlauf", "Beurteilung der Befestigungen durch unsere Projektleiterin Metallbau, Sandra Kälin", "Auszugsversuche mit unserem kalibrierten Prüfgerät an 21 Ankern (je Haus 5 an den Balkonen und 2 im Treppenhaus, rund 10 %), ausgewählt nach der Sichtprüfung nach Risiko (Korrosion, Spiel, Wetterseite); ausgeführt durch einen Monteur", "Zerstörungsfreie Zugprüfung mit einer Prüflast, die unsere Projektleiterin Metallbau aus der Geländerlast festlegt; bestanden, wenn der Anker bei gehaltener Last nicht nachgibt und keine Risse entstehen; Protokoll pro Anker mit Ort, Last, Haltezeit, Resultat und Foto; die Prüfstellen werden verschlossen", "Ein Nachtermin für Mieter, die wir nicht antreffen"]
    "3 Bericht mit Ampelbewertung": ["Datenblatt pro Geländer mit Fotos, Messwerten und Ampel", "Grün: sicher und gebrauchstauglich, nur Unterhalt (z. B. Schrauben nachziehen, Rostschutz punktuell), keine Frist", "Gelb: keine akute Absturzgefahr, aber Mangel am Zustand (beginnende Korrosion am Pfostenfuss, Spiel) oder Abweichung vom heutigen Stand nach SIA 358 und bfu (Höhe unter 1.00 m, bekletterbar, Öffnungen über 12 cm); Massnahme in 1 bis 2 Jahren oder Nachrüstung in der Massnahmenplanung. Das Datenblatt nennt die Art (Zustand oder Abweichung) und die Frist. Abweichungen, die alle Geländer desselben Typs betreffen, weisen wir einmal pro Typ aus", "Rot: Absturzgefahr oder ungenügende Tragfähigkeit (Auszugsversuch nicht bestanden, starke Korrosion, lockere Befestigung); Meldung und Sicherung am gleichen Tag, Reparatur sofort"]
    "4 Massnahmen und Kostenschätzung": ["Massnahmenliste nach Haus und Dringlichkeit, Kostenschätzung (±25 %) für die gelben und roten Geländer"]
    "5 Präsentation im Vorstand": ["Vorstellung von Bericht und Massnahmen an der Vorstandssitzung vom 19. Januar 2027"]
    "Option: Massnahmenplan und Ausschreibungsunterlagen": ["Massnahmenplan, Leistungsverzeichnis, Pläne und Fotodokumentation für die Ausschreibung der Geländersanierung", "Kann nach dem Bericht bestellt werden"]
  schedule:
    - "Aufnahme ab Mittwoch, 11. November 2026, Auszugsversuche in der Woche vom 16. November, Nachtermin bis Ende November."
    - "Bericht mit Ampelbewertung und Kostenschätzung bis Freitag, 18. Dezember 2026. Präsentation an der Vorstandssitzung vom 19. Januar 2027."
    - "Voraussetzung ist die Auftragserteilung bis Montag, 2. November 2026, damit der Aushang eine Woche vorher hängt."
  options_note: "Die Option kann mit dem Auftrag oder nach dem Bericht bestellt werden."
  closing: ["Bericht und Kostenschätzung dürfen für die Ausschreibung der Geländersanierung verwendet werden. Erstellen wir die Ausschreibungsunterlagen (Option), beteiligen wir uns nicht selbst an der Ausschreibung.", "Wir danken Ihnen für Ihr Vertrauen und stehen für Fragen gerne zur Verfügung."]
  order_by: "für die Wohnbaugenossenschaft Talkessel"
  signature_role: "Geschäftsführerin, Bauingenieurin FH"
