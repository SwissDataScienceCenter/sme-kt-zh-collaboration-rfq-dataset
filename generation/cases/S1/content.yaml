    body: |
      Grüezi Herr Bucher

      Besten Dank für Ihre Anfrage über unser Webformular. Gerne senden wir Ihnen im Anhang unsere Offerte für den Velounterstand Fronalp Velo mit 4 Modulen für 20 Velos.

      Modularer Velounterstand aus feuerverzinktem und pulverbeschichtetem Stahl, Dach Trapezblech. Die Fundamente mit Leerrohr erstellen wir. Den Elektroanschluss der Beleuchtung macht Ihr Elektriker; das Leerrohr bis zum Fundament sollte vor unseren Fundamentarbeiten verlegt sein. Mit der Ausführung beginnen wir, sobald die Baubewilligung rechtskräftig ist.

      Die zweite Seitenwand auf der Ostseite haben wir als Option aufgeführt. Sie ist im Total nicht enthalten und lässt sich auch später noch ergänzen.

      Zu Ihrer Frage nach einem Rabatt: Ihren Kundenrabatt von 2 % haben wir in der Offerte berücksichtigt.

      Die Lieferfrist beträgt 6 bis 8 Wochen ab Auftragsbestätigung und Farbwahl. Bitte beachten Sie unsere Betriebsferien vom 13. bis 31. Juli 2026 (KW 29 bis 31). Für eine Montage vor den Betriebsferien bräuchten wir Ihren Auftrag bis Mitte Mai, sonst montieren wir ab KW 32.

      Für Fragen stehe ich Ihnen gerne zur Verfügung.

      Freundliche Grüsse
      Daniel Inderbitzin
      Projektleiter Systemprodukte und Fassaden
      Fronalp Metall & Gebäudehülle AG
      Werkhofstrasse 12, 6438 Ibach
      +41 41 000 12 00

