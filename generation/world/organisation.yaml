# Single source of truth for the organisation of the Company world.
# Generation facing (English keys). Rendered documents are Swiss German.
# Phone block 041 000 xx xx is unassigned on purpose; UID has an invalid check digit on purpose.

company:
  name: Fronalp Metall & Gebäudehülle AG
  short: Fronalp
  street: Werkhofstrasse 12
  zip: "6438"
  city: Ibach
  canton: SZ
  phone_main: "+41 41 000 12 00"
  phone_picket: "+41 41 000 12 99"
  email_offers: offerten@fronalp-mgh.ch
  email_general: info@fronalp-mgh.ch
  web: www.fronalp-mgh.ch
  email_pattern: "{first}.{last}@fronalp-mgh.ch"   # lowercase, umlauts as ae/oe/ue
  uid: CHE-417.293.865
  vat_suffix: MWST
  bank: Schwyzer Kantonalbank (fictional IBAN generated per document)
  founded: 1962
  legal_form_since: 1988
  employees_approx: 35
  slogan: "Metall und Hülle aus einer Hand."

history:
  - year: 1962
    event: Alois Schuler opens the "Schlosserei A. Schuler" in Ibach (gates, railings, agricultural repairs).
  - year: 1979
    event: Move to the current site at Werkhofstrasse; first welding hall.
  - year: 1987
    event: Markus Schuler (son) takes over the sheet metal shop "Spenglerei Betschart" in Seewen; roofing and sheet metal added.
  - year: 1988
    event: Founding of Fronalp Metall & Gebäudehülle AG, named after the Fronalpstock visible from the workshop.
  - year: 1998
    event: Flat roof and terrace waterproofing added; first project managers hired.
  - year: 2005
    event: First System product, the bike shelter line "Fronalp Velo".
  - year: 2009
    event: New assembly hall; carport line "Fronalp Carport".
  - year: 2014
    event: Canopy line "Fronalp Vordach".
  - year: 2015
    event: Claudia Schuler (granddaughter, civil engineer FH) founds the Advisory unit "Fronalp Beratung".
  - year: 2019
    event: Claudia Schuler becomes managing director; Markus Schuler stays chairman of the board.
  - year: 2021
    event: Switch from the old DOS-era costing software "KALKO 4" to the ERP "MetaBau" (fictional). Article and customer numbers renumbered; old numbers kept only in a free text field.
  - year: 2022
    event: CRM "KundenCockpit" (fictional) introduced by Leandro Marty; customers imported from MetaBau, duplicates never fully cleaned.
  - year: 2024
    event: MetaBau offer print layout revised (Unit price offers, Tender responses, Configuration offers, Cost estimates); Advisory and Lump sum offers still written in Word.

systems:
  erp:
    name: MetaBau
    since: 2021
    holds: [item master, customers (debtors), projects, offers, invoices, booked hours]
    id_formats:
      customer: "D-#####"          # debtor number, new since 2021
      customer_legacy: "K####"     # KALKO 4 number, only in free text field "Alt-Nr."
      project: "P-YY-###"
      offer: "OF-YY-####"
      item: "GG.###.##"            # group.number.variant
  crm:
    name: KundenCockpit
    since: 2022
    holds: [contacts, companies, leads, activities, notes]
    id_formats:
      contact: "KC-#####"
      lead: "L-YYYY-###"
    known_issues:
      - Duplicate companies from the 2022 import (spelling variants, "AG" vs "A.G.").
      - Not all leads linked to an ERP debtor number.
      - Activity notes written in mixed German and English abbreviations.
    erp_known_issues:
      - Personnel entry dates migrated from KALKO 4 keep ISO format (YYYY-MM-DD) for entries before 2000; newer entries use DD.MM.YYYY.
      - Former employees stay in the personnel export with AKTIV = N.
  other:
    - Shared mailbox offerten@ (all RFQs land here; Erika Föhn sorts them).
    - File server: P:\\Projekte\\<Jahr>\\<Projektnr> <Objekt>\\ with subfolders 01_Anfrage, 02_Kalkulation, 03_Offerte, 04_Ausführung, 05_Abrechnung.
    - Excel costing sheets per business line; the estimator's private "Faustregeln.xlsx".
    - Phone and site notes as Word files or photos of handwritten notes.

business_lines:
  advisory:
    de: Beratung
    lead: CSc
    staff: [CSc, NSu, SKae]
  custom_build:
    de: Projektgeschäft (Dach, Spenglerei, Metallbau, Fassade)
    lead: RBe
    staff: [RBe, SKae, DIn, BUl]
  system_product:
    de: Systemprodukte (Velo, Carport, Vordach)
    lead: DIn
    staff: [DIn, TRe]

