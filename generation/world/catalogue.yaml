      - "Montagepauschale inkl. Montage der Optionen."
  carport:
    name: Fronalp Carport
    since: 2009
    code_prefix: "97.200"
    description: Carport aus Stahl, feuerverzinkt und pulverbeschichtet, Flachdach mit Trapezblech, Entwässerung über Speier an der Rückseite.
    standard: {clear_height_m: 2.20, colour: RAL 7016 Feinstruktur, altitude_max_m: 800}
    models:
      - {code: CP-E,  de: "Einzelcarport 3.00 x 5.00 m", unit: Stk, price: 8900}
      - {code: CP-EL, de: "Einzelcarport lang 3.00 x 6.00 m", unit: Stk, price: 9950}
      - {code: CP-D,  de: "Doppelcarport 6.00 x 5.00 m", unit: Stk, price: 14800}
    options:
      - {code: CP-OPT-PC,  de: "Dach Polycarbonat statt Trapezblech", unit: "% Grundpreis", pct: 0.12}
      - {code: CP-OPT-GDE, de: "Gründachvorbereitung Einzel", unit: Stk, price: 1450}
      - {code: CP-OPT-GDD, de: "Gründachvorbereitung Doppel", unit: Stk, price: 2600}
      - {code: CP-OPT-RF,  de: "Dachrinne mit Fallrohr", unit: Stk, price: 690}
      - {code: CP-OPT-SW,  de: "Seitenwand Lattung Lärche", unit: Seite, price: 1280}
