      - {code: CP-OPT-FUE, de: "Fundamente durch Fronalp, Einzel", unit: Stk, price: 2400}
      - {code: CP-OPT-FUD, de: "Fundamente durch Fronalp, Doppel", unit: Stk, price: 3600}
    colour_surcharge: {standard: "RAL 7016 Feinstruktur", other_ral: 0.08, db_colours: 0.12, base: models}
    assembly: {CP-E: 1650, CP-EL: 1750, CP-D: 2450}
    adaptation_rules:
      - "Überbreite: +2.5 % des Grundpreises je angefangene 10 cm, maximal +60 cm."
      - "Durchfahrtshöhe 2.40 m statt 2.20 m: +6 % des Grundpreises."
      - "Standort bis 800 m ü. M.: Standardausführung."
      - "Standort 801 bis 1200 m ü. M.: Ausführung 'Verstärkt', +18 % des Grundpreises (inkl. Überbreite)."
      - "Standort über 1200 m ü. M.: keine Katalogofferte, Abklärung Werkstatt (TRe)."
      - "Berechnung der Zuschläge: alle Prozentzuschläge auf den Grundpreis des Modells; der Zuschlag Verstärkt zusätzlich auf den Zuschlag Überbreite; Zuschläge auf ganze Franken runden."
      - "Für die Ausführungen Standard (bis 800 m) und Verstärkt (801 bis 1200 m) liegt eine Typenstatik inkl. Fundamente vor, bemessen für die Schneelast nach SIA 261 auf 800 m bzw. 1200 m Bezugshöhe; sie wird dem Baugesuch beigelegt und kann dem Kunden abgegeben werden."
