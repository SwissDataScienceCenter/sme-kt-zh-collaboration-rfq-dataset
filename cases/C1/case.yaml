scope_facts:
  - "Terrassenfläche effektiv 93.08 m2: Hauptfläche 12.40 x 5.20 m = 64.48 m2 plus Sitzplatz 4.40 x 6.50 m = 28.60 m2 (L-Form)."
  - "Offene Ränder mit Kupfer-Winkelblech und Stahlgeländer (Süd 16.80 + West 5.20 + Ost 6.50): 28.5 m. Anschluss an Fassade (12.40 + Versatz 1.30 + 4.40): 18.1 m."
  - "5 Fenstertüren, 2 Dachabläufe, keine Notüberläufe vorhanden; Küche hat ein Fenster (keine Tür) zum Sitzplatz."
  - "Attika im 4. OG, Material nur per Kran; Bewilligung öffentlicher Grund bei der Gemeinde Ingenbohl nötig."
  - "Herr Reding vom 25.05. bis 20.07. im Ausland; Zugang zur Terrasse nur über seine Wohnung. Deshalb keine Besichtigung vor der Offerte."
  - "Wohnung 3. OG bewohnt; Verwaltung verlangt Nachweis der Dichtheit nach Abschluss."
  - "Abdichtung gemeinschaftlich (STWEG), Plattenbelag Sondernutzungsrecht Attika: Grundofferte mit Wiederverwendung der Platten, neuer Belag als Mehrpreis zulasten Eigentümer."
  - "Neuer Aufbau rund 12 cm höher als Bestand: Schwellen der Fenstertüren und Geländerhöhe vor Ort zu prüfen."
assumptions:
  - "Fläche gemäss Plan Nr. 104: 93 m2"
  - "Bestehende Dämmung durchnässt, vollständiger Ersatz von Dämmung und Dampfsperre"
  - "Kein Gefälle in der Rohdecke; Gefälle mit Gefälledämmung"
  - "Anschlusshöhen bei den Fenstertüren mit den Massnahmen gemäss Offerte ausreichend"
client_provisions:
  - Unentgeltlicher Strom- und Wasseranschluss
  - Platz für Mulde und Kran vor der Liegenschaft (Bewilligung öffentlicher Grund durch Fronalp)
  - Freier Zugang zur Terrasse über die Attikawohnung
  - Räumen der Terrasse (Möbel, Pflanzentröge)
reservations:
  - Anschlusshöhen bei den Fenstertüren und Geländerhöhe werden vor Ausführung geprüft; allfällige Massnahmen gemäss Eventualpositionen.
  - Nicht sichtbare Mängel am Untergrund werden nach Aufwand verrechnet.
  - Abgerechnet wird nach Ausmass.

