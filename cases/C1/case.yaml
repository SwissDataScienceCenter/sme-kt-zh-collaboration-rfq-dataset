flaws:
  - {id: C1-F1, marker: "Gesamtfläche ca. 70 m2", type: contradiction, where: "offer heading vs line items", description: "Offer heading states 'Gesamtfläche ca. 70 m2' (copied from the property manager's mail) while all positions use 93 m2; the difference is not explained although the meeting notes say it would be."}
  - {id: C1-F2, marker: "ca. 70 m2", type: outdated_info, where: "request/2026-05-12 first mail; request/2026-06-02 property manager mail", description: "Customer and property manager state ca. 70 m2 from the sales brochure; the 1993 plan gives 64.48 + 28.60 m2."}
  - {id: C1-F3, marker: "Fotos anbei", type: missing_attachment, where: "request/2026-05-12 first mail", description: "Mail announces photos ('Fotos anbei'), none attached; photos never arrive."}
  - {id: C1-F4, marker: "c/o Talkessel", type: ambiguity, where: "request mails and CRM", description: "Who is the Besteller: owner Thomas Reding initiates, but the STWEG c/o Talkessel Immobilien-Treuhand AG is the client; the CRM lead stays linked to Reding. Contact Claudia Kälin shares first name with Claudia Schuler and last name with Sandra Kälin."}
  - {id: C1-F5, marker: "eher 90??", type: verbal_only, where: "operations/File note RBe 2026-05-15; operations/CRM print", description: "Area hint 'eher 90 m2' only in a File note; owner approval and the 2 % discount only as a CRM activity after a phone call."}
  - {id: C1-F6, type: stale_template, where: "offer Eventualposition new slabs", description: "Estimator uses 10 % waste and rounds up (103 m2) following his rules of thumb, while the costing manual says 8 %."}
  - {id: C1-F7, type: contradiction, where: "offer discount vs ERP debtor Talkessel D-10115", description: "Offer grants 2 % regular customer discount; the ERP debtor record of the property manager shows 0 %."}
  - {id: C1-F8, marker: "Neu: 1 Notüberlauf", type: contradiction, where: "request/2026-06-19 meeting notes §4 vs offer", description: "Notes of the property manager record 1 emergency overflow; the project manager follows the rule of one per drain and offers 2."}
  - {id: C1-F9, marker: "Gibt es schon etwas Neues", type: noise, where: "request/2026-07-01 owner reminder and reply", description: "Owner asks for status by mail; adds nothing to the Offer."}
  - {id: C1-F10, marker: "Lindenstrasse 29", type: ambiguity, where: "ERP debtors D-12348 vs CRM KC-21002", description: "The ERP holds an older debtor Thomas Reding in Seewen with a similar email; the back office created a new CRM contact without duplicate check."}
