  - "2026-10-22 08:10 CSc fragt Schmidig nach Befestigung der Treppenhausgeländer und Zugang."
  - "2026-10-23 11:30 Schmidig: seitlich befestigt, ca. 16 Befestigungen pro Haus (Hauswart), Aushang für die Mieter, Termine ab 9. November; Geländer Haus 13 am 06.10. repariert, Hauswart hat alle Balkongeländer von Hand geprüft."
  - "2026-10-26 09:20 SKä gibt CSc ihre Stunden für Befestigungen, Bericht und Kostenschätzung."
  - "2026-10-27 15:50 CSc sendet die Honorarofferte OF-26-0254 an den Präsidenten, Kopie Schmidig."
systems_state:
  - "CRM print of lead L-2026-249, linked to the duplicate KC-30914 without ERP number and without earlier activities."
  - "ERP debtor D-10143: RABATT_PROZ 2.0; earlier offers OF-25-0095 (lost) and OF-25-0097 (Geländerprüfung Bachmatt, P-25-047)."

basis_for_estimate:
  - "P-25-047 Bachmatt 2025, same customer (16 balconies, 2 stairwells): phases, 20 min per balcony, 1.5 h per stairwell, Nachtermin, 10 pull tests, report 20 min per railing + 2 h, presentation as extra effort"
  - "P-24-124 Küssnacht 2025 (12 balconies, 1 stairwell): origin of the pull test rule, Rot reported the same day"
  - "Faustregeln Beratung 2025: pull tests 10 % of the anchors per building, min. 3, 0.5 h MA each, vehicle per test day; SKä as B2"
  - "Richtofferte OF-26-0236 (balconies only) and SKä's hours of 26.10."

assumptions:
  - "36 Balkone (je Haus 12 im 1. bis 3. OG); die Wohnungen im EG haben Sitzplätze ohne Geländer"
  - "3 Treppenhausgeländer mit Handlauf von 2015, seitlich befestigt, ca. 16 Befestigungen pro Haus"
  - "Balkongeländer mit 2 Pfosten auf Fussplatte, je 2 Anker; zusammen rund 64 Anker pro Haus"
  - "Auszugsversuche als Stichprobe: 10 % der Anker pro Haus, je Haus 5 an den Balkonen und 2 im Treppenhaus, total 21; Auswahl nach der Sichtprüfung nach Risiko (Korrosion, Spiel, Wetterseite)"
  - "Vorgehen mit Stichprobe bitte mit Ihrer Haftpflichtversicherung abstimmen"
  - "Zugang zu den Balkonen über die Wohnungen, ein Nachtermin für nicht angetroffene Mieter eingerechnet"
  - "Fotos zeigen nur die Geländer, Bezeichnung nach Wohnungsnummer; der Bericht geht an den Vorstand und auf Wunsch an die Versicherung"
  - "Bericht als PDF mit Datenblatt pro Geländer, Massnahmenliste als Excel"
client_provisions:
  - "Information der Mieter mit Aushang und Zugang zu den Wohnungen, Hauswart begleitet die Aufnahme"
  - "Zugang zu rund 15 Wohnungen für die Auszugsversuche in der Woche vom 16. November, Termine im gleichen Aushang"
  - "Vorhandene Pläne und Unterlagen der Treppenhaussanierung 2015"
exclusions:
  - "Reparatur des Geländers Rütimattstrasse 13 (am 06.10.2026 separat nach Regie ausgeführt)"
  - "Reparatur oder Ersatz von Geländern, Sicherungsmassnahmen bei roten Befunden (nach Regie)"
  - "Statische Nachweise, Prüfung der Balkonplatten und der Treppenkonstruktion; sichtbare Schäden an den Plattenrändern melden wir und empfehlen eine Abklärung durch einen Ingenieur"
  - "Sitzplätze und Gartenmauern im EG"
reservations:
  - "Fällt ein Auszugsversuch durch, sichert der Monteur das Geländer sofort und informiert den Hauswart; nach Rücksprache verdoppeln wir die Stichprobe in diesem Haus; Mehraufwand nur nach schriftlicher Zustimmung der Auftraggeberin"
  - "Rote Befunde melden wir am gleichen Tag der Genossenschaft und dem Hauswart; der Hauswart sperrt den Balkon, die Sicherung macht unsere Montage nach Regie"
  - "Der Bericht beschreibt den sichtbaren Zustand am Tag der Aufnahme und die geprüften Anker; für nicht geprüfte Anker gibt er keine Gewähr"
  - "Die Offerte beruht auf den Angaben von Frau Schmidig und des Hauswarts, eine Begehung hat nicht stattgefunden; zeigen sich abweichende Verhältnisse, behalten wir uns Anpassungen vor (H1)"

