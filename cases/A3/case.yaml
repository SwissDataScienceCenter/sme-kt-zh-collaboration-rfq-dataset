# Story bible and ground truth for Case A3 (ADR 0006, ADR 0007, case_quality.md §2). Q51 to Q63 confirmed by the maintainer 2026-11-12.
id: A3
title: Prüfung der Balkon- und Treppenhausgeländer, Siedlung Rütimatt, Schwyz
business_line: advisory
offer_type: fee_offer            # preceded by a cost estimate (Richtofferte) that is part of the inputs
difficulty: medium               # verbal agreement vs later email, CRM duplicate, balcony count
dates:
  first_contact: 2026-09-28      # Monday
  cost_estimate: 2026-10-01      # Thursday
  board_meeting: 2026-10-20      # Tuesday
  offer: 2026-10-27              # Tuesday
  valid_until: 2027-01-27

customer:
  ref: D-10143 / KC-20029        # Wohnbaugenossenschaft Talkessel, Schwyz, existing customer, ERP discount 2 %
  duplicate: KC-30914            # "WBG Talkessel", import 2022, other phone, no ERP link (A3-F2)
  contact: Frau Franziska Schmidig, Vorstand Ressort Bau
  signs: Herr Bruno Gwerder, Präsident (not in CRM)
object:
  address: Siedlung Rütimatt, Rütimattstrasse 11, 13 und 15, 6430 Schwyz
  description: Drei Mehrfamilienhäuser von 1968, je 4 Wohnungen pro Geschoss im 1. bis 3. OG mit Balkon, im EG Wohnungen mit Sitzplatz ohne Geländer; Balkongeländer original (Stahl, Querstäbe, 90 cm, 2 Pfosten auf Fussplatte mit je 2 Ankern); Treppenhausgeländer und Handläufe 2015 erneuert, seitlich an der Treppe befestigt.
staff: {owner: CSc, involved: [NSu, SKae, DHo, EFoe]}

facts:
  houses: 3
  balconies_per_house: 12
  balconies_stated: 40           # president's mail counts flats (A3-F3)
  anchors_per_balcony: 4
  anchors_per_stairwell: 16      # Hauswart via Schmidig 23.10.
  stairwells: 3
derived:
  balconies: "F.houses * F.balconies_per_house"                                   # 36
  anchors_house: "F.balconies_per_house * F.anchors_per_balcony + F.anchors_per_stairwell"   # 64
  tests_house: "max(3, ceil(round(0.1 * F.balconies_per_house * F.anchors_per_balcony, 6)) + ceil(round(0.1 * F.anchors_per_stairwell, 6)))"   # 5 + 2 = 7
  tests: "F.houses * F.tests_house"                                               # 21
  railings: "F.balconies + F.stairwells"                                          # 39
checks:
  - "F.balconies == 36 and F.tests == 21 and F.railings == 39"
  - "qty('99.100.01') == F.tests * 0.5"
  - "qty('99.110.01') == 2"
  - "qty('99.100.06') > 0 and qty('99.100.07') > 0"
  - "opt('99.100.07') > 0"

