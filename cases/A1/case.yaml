  ref: D-10122 / KC-20020        # Rigi Verwaltungen AG, Goldau, existing customer, no ERP discount
  besteller: Rigi Verwaltungen AG im Auftrag der Stiftung Wohnen Hofmatt
  contact: Herr Andreas Gisler, Bewirtschafter
  owner: Stiftung Wohnen Hofmatt, Steinen (decides via Stiftungsrat; not in CRM)
object:
  address: Hofmattweg 2 und 4, 6422 Steinen (reserved address, DL-163)
  description: Zwei Mehrfamilienhäuser mit je 9 Wohnungen, Baujahr 1974, Flachdächer mit Kies auf Bitumenabdichtung (Originalaufbau 1974, Teilreparaturen 1998), Dachrand Kupferblech, Zugang nur über Dachluke, kein Geländer.
staff: {owner: CSc, involved: [NSu, RBe, EFoe]}

facts:
  roofs: 2
  roof_width: 16.0               # per house, from the 1974 plan
  roof_depth: 20.0
  area_stated_by_customer: 500   # first mail, wrong (A1-F2)
  build_year: 1974
  repair_year: 1998
  leaking_flats: 2               # 3. OG Haus 4
  storm_date: 2026-05-14
