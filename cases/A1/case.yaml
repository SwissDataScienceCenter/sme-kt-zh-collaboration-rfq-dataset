  options_in_base_offer: 2       # PV preparation only as optional item (05.06.)
  zone: 1                        # Steinen
derived:
  roof_area: "F.roofs * F.roof_width * F.roof_depth"            # 640 m2
  probes: "F.roofs * 2 + 1"                                     # 2 per roof (past offers: 1 per started 200 m2) + 1 at the leak
checks:
  - "F.roof_area == 640"
  - "qty('98.100.05') == F.probes"
  - "qty('98.100.04') == F.roofs"
  - "qty('99.100.01') > 0"        # second person on the roof (fall protection)
  - "qty('98.100.03') == 0"       # no thermography in June (A1-F3)
  - "qty('98.100.02') == 0"       # no drone; roof walkable, caretaker opens the hatch
  - "opt('99.100.08') > 0 and opt('99.100.07') > 0"   # PV option

timeline:
  - "2026-05-14 Gewitter mit Starkregen; Wasser tritt in zwei Wohnungen im 3. OG von Haus 4 ein."
  - "2026-05-18 08:12 Gisler mailt an info@: Zustandsaufnahme mit Thermografie und Kurzbericht, ob Reparatur reicht, Dachfläche 'ca. 500 m2'."
  - "2026-05-18 09:05 EFö erfasst Lead L-2026-161 für KC-20020 und leitet an CSc weiter."
  - "2026-05-19 CSc telefoniert mit Gisler (Aktennotiz CSc): Begehung 27.05. mit Hauswart, Stiftungsrat tagt am 29.05., Erstbegehung ohne Kosten."
  - "2026-05-27 Begehung NSu und CSc mit Hauswart (Aktennotiz NSu): Befund, Verdacht auf asbesthaltige Dachpappe und Kitt, kein Geländer, Absturzsicherung nötig."
  - "2026-05-28 Gisler mailt die Pläne von 1974 als Scan (Dachaufsicht mit Massen)."
  - "2026-06-01 Gisler nach dem Stiftungsrat: drei Varianten mit Kostenschätzung für Budget 2027, dazu Begleitung Ausschreibung (Scope 1)."
  - "2026-06-03 CSc antwortet: Thermografie nur in der Heizperiode, Frage nach PV und Ausschreibung."
  - "2026-06-05 Gisler: Ausschreibung macht die Verwaltung selbst, PV nur als Option, ohne Thermografie einverstanden (Scope 2)."
  - "2026-06-08 RBe gibt CSc seine Stunden für die Kostenschätzung (Mail, Einzeiler)."
  - "2026-06-09 16:40 CSc sendet die Honorarofferte OF-26-0147 als PDF (Word, unterschrieben)."
systems_state:
  - "CRM print of lead L-2026-161 with KC-20020 and its activities from 18.05. to 09.06."
  - "ERP debtor D-10122: RABATT_PROZ 0.0, ZAHLKOND 30T NETTO (company export)."
  - "Past advisory offers in the ERP offer export (base history) and two past project folders (below)."

basis_for_estimate:              # ADR 0007: no hour table exists; the estimator scales from similar past offers
  - "P-25-102 Brunnen 2025 (380 m2, 1 Dach, 2 Varianten): Phasenstruktur, Stunden pro Variante, RBe für Kostenschätzung, Asbest vor Sondierung, zweite Person, Mehraufwand durch zusätzliche Besprechung"
  - "P-24-003 Ibach 2024 (450 m2, nur Zustand): Aufnahme pro Fläche, Bericht, Thermografie nur im Winter"
  - "Stundenexport 2025: effektive Stunden P-25-102 nach Person und Kategorie"
  - "Honorarofferten 'Zustandsaufnahme Flachdach' im Offertexport 2024 bis 2026 als Grössenordnung (Mindesthonorar 2'500)"

assumptions:
  - "Dachfläche 640 m2 gemäss Plänen 1974 (2 x 16.0 x 20.0 m)"
  - "Zugang über die Dachluken, der Hauswart öffnet; Dachluke während der Arbeiten gesichert"
  - "Aufnahme mit Anseilschutz und Rückhaltesystem, immer zu zweit, Rettungsablauf festgelegt"
  - "Probenahme Schadstoffe mit Schutzmassnahmen (Befeuchten, Atemschutz FFP3): eine kleine Kernprobe je Dach durch den ganzen Aufbau, provisorisch verschlossen, sowie Kittfugen, Lüftungsrohr und Kaminabdeckung"
  - "Sondierungen durch zwei Mitarbeitende unserer Abdichtungsequipe (in der Pauschale enthalten)"
  - "Sondierungen nach Vorliegen des Laborresultats und nur bei trockenem Wetter"
client_provisions:
  - "Laborkosten der Schadstoffanalyse (Asbest, PCB, PAK); Fronalp nimmt die Proben und beauftragt das Labor, Weiterverrechnung zum Nettopreis, Richtwert CHF 540 bis 1'200 für 6 bis 8 Proben"
  - "Zugang zu den Wohnungen 3. OG Haus 4 für die Aufnahme der Wasserschäden, Information der Mieter"
  - "Vorhandene Pläne und Unterlagen früherer Reparaturen"
exclusions:                      # Nicht enthaltene Leistungen
  - "Thermografie (nur in der Heizperiode Oktober bis März sinnvoll, auf Kiesdächern wenig aussagekräftig)"
  - "Begleitung Ausschreibung und Ausführung (macht die Verwaltung)"
  - "Statische Prüfung für PV oder zusätzliche Dämmung durch Ingenieurbüro (auf Wunsch über Statik Talkessel AG)"
  - "Sofortmassnahme Haus 4 (auf Wunsch nach Regie, separat)"
  - "Schadstoffsanierung und Entsorgung belasteter Materialien"
  - "Gesuche für Förderbeiträge und Baubewilligung, Bewilligungsgebühren, Ausführung der Bauarbeiten"
reservations:
  - "Bei positivem Schadstoffbefund werden die Sondierungen mit Schutzmassnahmen nach Suva ausgeführt; Mehraufwand nur nach schriftlicher Zustimmung der Auftraggeberin"

