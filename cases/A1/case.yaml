evaluation:                      # ADR 0007: Advisory Offers are graded by content and a fee band
  fee_band: 0.20                 # net fee within +/- 20 % of the reference
  must_contain:
    - "Fläche 640 m2, nicht 500 m2"
    - "Phasen 1 bis 3, keine Phase 4 Ausschreibung"
    - "zwei Varianten im Honorar, PV-Vorbereitung als Option ausserhalb des Totals"
    - "keine Thermografie, mit Begründung Jahreszeit"
    - "Schadstoffanalyse (mindestens Asbest) vor den Sondierungen, Laborkosten ausserhalb des Honorars"
    - "Absturzsicherung bei der Aufnahme, zweite Person"
    - "Stiftung als Auftraggeberin, vertreten durch die Verwaltung"
    - "Termine mit Betriebsferien und Unterlagen vor der Sitzung vom 4. September"
    - "Kostendach, Verrechnung nach Aufwand, CSc unterschreibt"
  must_not_contain:
    - "Thermografie als Position"
    - "Begleitung Ausschreibung als Position"
    - "gesperrte Pauschalen 98.110"

acceptable_alternatives:
  - "Phasen 1 bis 3 zusammen 45 bis 60 Std"
  - "Sondierungen 4 bis 6, Feuchtemessung 1 oder 2 Pauschalen"
  - "zweite Person als MA oder B3"
  - "Präsentation Stiftungsrat als Option, im Grundauftrag oder weggelassen"
  - "Spesen 30 bis 60 km"
