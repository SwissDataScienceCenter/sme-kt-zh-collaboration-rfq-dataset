id: A1
title: Zustandsaufnahme und Sanierungsvarianten Flachdächer Hofmatt, Steinen
business_line: advisory
offer_type: fee_offer
difficulty: medium               # consulting style: scope only becomes clear in the thread
dates:
  first_contact: 2026-05-18      # Monday
  site_walk: 2026-05-27          # Wednesday
  board_meeting: 2026-05-29      # Stiftungsrat, Friday
