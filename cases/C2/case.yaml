derived:
  height: "round(F.height_slab + F.tiles_new, 2)"                       # 2.82
  risers: "ceil(round(F.height / 0.18, 6))"                             # 16
  treads: "F.risers - 1"                                                # 15
  rise: "round(F.height / F.risers, 4)"                                 # 0.1762
  going: "floor(round((F.run_available - 0.15) / F.treads * 100, 6)) / 100"   # 0.27 (15 cm before the foot)
  run_used: "round(F.going * F.treads, 2)"                              # 4.05
  diag: "round(sqrt(F.run_used ** 2 + F.height ** 2), 2)"               # 4.94
  stringer: "round(F.diag + 0.34, 2)"                                   # 5.28
  railing: "ceil(round((F.diag + 0.5) * 10, 6)) / 10"                   # 5.5
  handrail_wall: "ceil(round((F.diag + 0.1) * 10, 6)) / 10"             # 5.1
  stair_kg: "round(2 * F.stringer * 18.84 + 4 * F.treads + 24, 1)"      # 283.0
  bars_kg: "round(F.treads * 1.0 * 2.51, 2)"                            # 37.65, rise over 15 cm
  coat_A: "ceil(round(0.4 * F.risers + 2.0 * F.railing + 0.15 * F.railing + 0.25, 6))"   # 19 (incl. railing handrail and new post)
  coat_B: "ceil(round(1.2 * F.railing + 0.15 * F.handrail_wall + 0.25, 6))"   # 8 (incl. new post)
  holders: "ceil(F.handrail_wall)"                                      # 6
checks:
  - "F.risers == 16 and F.treads == 15 and F.going == 0.27"
  - "0.62 <= 2 * F.rise + F.going <= 0.64 and F.rise <= 0.18"
  - "F.run_used + 0.15 <= F.run_available"
  - "F.stringer <= 5.5 and F.stringer * 18.84 <= 150"                    # own loader crane
  - "F.railing == 5.5 and F.coat_A == 19 and F.coat_B == 8"

